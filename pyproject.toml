[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvrunner"
version = "2.0.0"
description = "Terminal game library and Proton launcher"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
hvrunner = "hvrunner.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Keep tool caches out of the repository root.
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "PTH"]
# The formatter owns line length, so the linter does not also police it.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The affinity watcher walks every process on the machine four times a second
# while a game runs, so it works in os.scandir, open and os.readlink on purpose:
# the pathlib forms allocate a Path per process and cost three times as much.
# Measured at 17 ms a pass before and under 5 after.
"src/hvrunner/core/affinity.py" = ["PTH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
# Excluded from bin/check: each one drives a real pty and waits seconds on it.
# Run them with: pytest -m integration
markers = ["integration: drives a real terminal through a pty"]
